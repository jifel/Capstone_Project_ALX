{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QTrack - Welcome</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-blue-600 to-purple-700 h-screen flex items-center justify-center">

  <div class="bg-white shadow-2xl rounded-3xl p-12 max-w-lg w-full text-center">
    <!-- Logo / Title -->
    <h1 class="text-5xl font-extrabold text-gray-800 mb-4">QTrack</h1>
    <p class="text-lg text-gray-600 mb-8">
      Your reliable Quality & Issue Tracking System
    </p>

    <!-- Illustration -->
    <img src="{% static 'images/analytics.svg' %}" 
         alt="QTrack Illustration" 
         class="mx-auto mb-10 w-56">

    <!-- Action Buttons -->
    <div class="space-y-4">
      <a href="{% url 'signup' %}"
         class="block w-full py-4 rounded-xl bg-green-600 text-white font-semibold shadow-md hover:bg-green-700 transition text-lg">
        Create an Account
      </a>

      <a href="{% url 'login' %}"
         class="block w-full py-4 rounded-xl bg-blue-600 text-white font-semibold shadow-md hover:bg-blue-700 transition text-lg">
        Log In
      </a>
    </div>

    <!-- Footer -->
    <p class="text-xs text-gray-400 mt-8">© 2025 QTrack. All rights reserved.</p>
  </div>

</body>
</html>
