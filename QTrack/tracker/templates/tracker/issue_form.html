{% extends "base.html" %}

{% block title %}Create New Issue | QTrack{% endblock %}

{% block content %}
<div class="container py-5">

    <!-- Back Button -->
    <div class="mb-4">
        <a href="{% url 'issue_list' %}" class="btn btn-outline-secondary">
            ← Back to Issues
        </a>
    </div>

    <!-- Card Container -->
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-lg border-0 rounded-4">
                
                <!-- Card Header -->
                <div class="card-header bg-primary text-white text-center rounded-top-4">
                    <h3 class="mb-0">Create New Issue</h3>
                </div>

                <!-- Card Body -->
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}

                        <!-- Title -->
                        <div class="mb-3">
                            <label for="{{ form.title.id_for_label }}" class="form-label fw-semibold">Title</label>
                            {{ form.title }}
                        </div>

                        <!-- Description -->
                        <div class="mb-3">
                            <label for="{{ form.description.id_for_label }}" class="form-label fw-semibold">Description</label>
                            {{ form.description }}
                        </div>

                        <!-- Priority & Status -->
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="{{ form.priority.id_for_label }}" class="form-label fw-semibold">Priority</label>
                                {{ form.priority }}
                            </div>

                            <div class="col-md-6">
                                <label for="{{ form.status.id_for_label }}" class="form-label fw-semibold">Status</label>
                                {{ form.status }}
                            </div>
                        </div>

                        <!-- Submit -->
                        <div class="mt-4 d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">Save Issue</button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
{% endblock %}
