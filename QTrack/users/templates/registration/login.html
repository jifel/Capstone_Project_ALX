{% extends "base.html" %}

{% block title %}Log In | QTrack{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg border-0 rounded-3">
            <div class="card-body p-4">
                <!-- Header -->
                <h3 class="text-center fw-bold mb-2">Welcome Back</h3>
                <p class="text-center text-muted mb-4">
                    Log in to continue managing your tasks 🚀
                </p>

                <!-- Login Form -->
                <form method="post">
                    {% csrf_token %}

                    <!-- Username -->
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Username</label>
                        <input type="text" name="username" autofocus required
                               class="form-control" id="id_username">
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label for="id_password" class="form-label">Password</label>
                        <input type="password" name="password" required
                               class="form-control" id="id_password">
                    </div>

                    <!-- Submit -->
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            Log In
                        </button>
                    </div>
                </form>

                <!-- Signup link -->
                <p class="text-center mt-3">
                    Don’t have an account? 
                    <a href="{% url 'signup' %}" class="fw-bold text-decoration-none">Sign up</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
