{% extends "base.html" %}

{% block title %}Sign Up | QTrack{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg border-0 rounded-3">
            <div class="card-body p-4">
                <!-- Header -->
                <h3 class="text-center fw-bold mb-2">Create Your Account</h3>
                <p class="text-center text-muted mb-4">
                    Join QTrack and start managing issues effortlessly 🚀
                </p>

                <!-- Signup Form -->
                <form method="post">
                    {% csrf_token %}

                    <!-- Username -->
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Username</label>
                        <input type="text" name="username" maxlength="150" autofocus required 
                               class="form-control" id="id_username">
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label for="id_password1" class="form-label">Password</label>
                        <input type="password" name="password1" required 
                               class="form-control" id="id_password1">
                    </div>

                    <!-- Confirm Password -->
                    <div class="mb-3">
                        <label for="id_password2" class="form-label">Confirm Password</label>
                        <input type="password" name="password2" required 
                               class="form-control" id="id_password2">
                    </div>

                    <!-- Submit -->
                    <div class="d-grid">
                        <button type="submit" class="btn btn-success btn-lg">
                            Sign Up
                        </button>
                    </div>
                </form>

                <!-- Login link -->
                <p class="text-center mt-3">
                    Already have an account? 
                    <a href="{% url 'login' %}" class="fw-bold text-decoration-none">Log in</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
